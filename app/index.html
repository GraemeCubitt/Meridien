<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap');
 
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: #06060a;
  }
 
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
  }
 
  .content {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 10;
  }
 
  .wordmark {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(48px, 10vw, 120px);
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.92);
    text-shadow:
      0 0 80px rgba(180, 140, 255, 0.4),
      0 0 160px rgba(100, 160, 255, 0.2);
    animation: fadeIn 3s ease forwards, breathe 8s ease-in-out 3s infinite;
    opacity: 0;
    margin-bottom: 28px;
    padding-right: 0.35em; /* optical centering for letter-spacing */
  }
 
  .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(13px, 2vw, 18px);
    letter-spacing: 0.45em;
    color: rgba(255, 255, 255, 0.3);
    animation: fadeIn 3s ease 1.2s forwards;
    opacity: 0;
    padding-right: 0.45em;
  }
 
  .dot {
    display: inline-block;
    animation: dotPulse 2.4s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.4s; }
  .dot:nth-child(3) { animation-delay: 0.8s; }
 
  .rule {
    width: 1px;
    height: 0;
    background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.15), transparent);
    margin: 32px auto;
    animation: ruleGrow 2s ease 0.8s forwards;
  }
 
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
 
  @keyframes breathe {
    0%, 100% { text-shadow: 0 0 80px rgba(180,140,255,0.4), 0 0 160px rgba(100,160,255,0.2); }
    50%       { text-shadow: 0 0 120px rgba(180,140,255,0.6), 0 0 240px rgba(100,160,255,0.35), 0 0 400px rgba(160,100,255,0.1); }
  }
 
  @keyframes dotPulse {
    0%, 100% { opacity: 0.3; }
    50%       { opacity: 1; }
  }
 
  @keyframes ruleGrow {
    to { height: 60px; }
  }
</style>
</head>
<body>
 
<canvas id="c"></canvas>
 
<div class="content">
  <div class="wordmark">Meridian</div>
  <div class="rule"></div>
  <div class="tagline">
    coming soon
    <span class="dot"> .</span><span class="dot"> .</span><span class="dot"> .</span>
  </div>
</div>
 
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
 
let W, H, particles = [];
 
// Fog particle
class Orb {
  constructor() { this.reset(true); }
 
  reset(initial) {
    this.x = Math.random() * W;
    this.y = initial ? Math.random() * H : H + 100;
    this.r = 180 + Math.random() * 320;
    this.vx = (Math.random() - 0.5) * 0.18;
    this.vy = -(0.08 + Math.random() * 0.18);
    this.life = 0;
    this.maxLife = 420 + Math.random() * 360;
    this.hue = [
      240 + Math.random() * 40,   // deep blue-violet
      260 + Math.random() * 30,   // violet
      200 + Math.random() * 30,   // cool blue
      280 + Math.random() * 20,   // purple
    ][Math.floor(Math.random() * 4)];
    this.sat = 40 + Math.random() * 35;
    this.lgt = 18 + Math.random() * 22;
    this.twist = (Math.random() - 0.5) * 0.004;
    this.angle = Math.random() * Math.PI * 2;
    if (initial) this.life = Math.random() * this.maxLife;
  }
 
  draw() {
    this.life++;
    this.angle += this.twist;
    this.x += this.vx + Math.sin(this.angle) * 0.12;
    this.y += this.vy;
 
    if (this.life > this.maxLife || this.y < -this.r * 2) {
      this.reset(false);
      return;
    }
 
    const t = this.life / this.maxLife;
    // fade in then fade out
    const alpha = t < 0.15
      ? t / 0.15
      : t > 0.75
        ? 1 - (t - 0.75) / 0.25
        : 1;
 
    const grad = ctx.createRadialGradient(
      this.x, this.y, 0,
      this.x, this.y, this.r
    );
 
    const a = alpha * 0.13;
    grad.addColorStop(0,   `hsla(${this.hue},${this.sat}%,${this.lgt}%,${a})`);
    grad.addColorStop(0.4, `hsla(${this.hue},${this.sat}%,${this.lgt * 0.7}%,${a * 0.5})`);
    grad.addColorStop(1,   `hsla(${this.hue},${this.sat}%,${this.lgt}%,0)`);
 
    ctx.beginPath();
    ctx.ellipse(
      this.x, this.y,
      this.r,
      this.r * (0.6 + Math.sin(this.angle * 2) * 0.15),
      this.angle,
      0, Math.PI * 2
    );
    ctx.fillStyle = grad;
    ctx.fill();
  }
}
 
// Slow swirl layer — large background blooms
class Bloom {
  constructor() { this.reset(); }
 
  reset() {
    this.x = W * (0.2 + Math.random() * 0.6);
    this.y = H * (0.2 + Math.random() * 0.6);
    this.r = 300 + Math.random() * 400;
    this.hue = 220 + Math.random() * 80;
    this.angle = Math.random() * Math.PI * 2;
    this.speed = 0.0003 + Math.random() * 0.0004;
    this.drift = 0.15 + Math.random() * 0.2;
    this.phase = Math.random() * Math.PI * 2;
    this.t = 0;
  }
 
  draw() {
    this.t += this.speed;
    this.angle += this.speed * 0.5;
    this.x += Math.sin(this.t + this.phase) * this.drift;
    this.y += Math.cos(this.t * 0.7 + this.phase) * this.drift * 0.6;
 
    // keep in bounds loosely
    if (this.x < -this.r) this.x = W + this.r * 0.5;
    if (this.x > W + this.r) this.x = -this.r * 0.5;
    if (this.y < -this.r) this.y = H + this.r * 0.5;
    if (this.y > H + this.r) this.y = -this.r * 0.5;
 
    const pulse = 0.05 + Math.sin(this.t * 3 + this.phase) * 0.02;
 
    const grad = ctx.createRadialGradient(
      this.x, this.y, 0,
      this.x, this.y, this.r
    );
    grad.addColorStop(0,   `hsla(${this.hue},50%,20%,${pulse})`);
    grad.addColorStop(0.5, `hsla(${this.hue},40%,12%,${pulse * 0.4})`);
    grad.addColorStop(1,   `hsla(${this.hue},30%,8%,0)`);
 
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
  }
}
 
function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
 
function init() {
  resize();
  particles = [];
  // background blooms
  for (let i = 0; i < 6; i++) particles.push(new Bloom());
  // fog orbs
  for (let i = 0; i < 28; i++) particles.push(new Orb());
}
 
function draw() {
  // dark trailing fade — not full clear, creates smear/blur feel
  ctx.fillStyle = 'rgba(6,6,10,0.18)';
  ctx.fillRect(0, 0, W, H);
 
  ctx.globalCompositeOperation = 'screen';
  for (const p of particles) p.draw();
  ctx.globalCompositeOperation = 'source-over';
 
  requestAnimationFrame(draw);
}
 
window.addEventListener('resize', () => { resize(); });
init();
draw();
</script>
</body>
</html>
